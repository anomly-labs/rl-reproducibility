name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    name: demo (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (numpy only — the sole runtime dependency)
        run: python -m pip install --upgrade pip numpy
      - name: Reference-reduction selftest (fsum == arbitrary-precision gold)
        run: python refquire.py
      - name: Full demo suite (its exit code gates the build)
        run: python demo.py
